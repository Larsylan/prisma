name: Installateurs

# Produit les installateurs de chaque système, les installe et lance l'app pour vérifier qu'elle fonctionne vraiment.
# Une étiquette `v…` publie ensuite ces installateurs dans une Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Un seul .dmg pour les Mac Apple Silicon et Intel.
          - os: macos-latest
            bundles: app,dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            target-args: --target universal-apple-darwin
            bundle-dir: target/universal-apple-darwin/release/bundle
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
            bundle-dir: target/release/bundle
          - os: windows-latest
            bundles: msi,nsis
            bundle-dir: target/release/bundle
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev libxdo-dev xvfb imagemagick dbus

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installateurs
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }} ${{ matrix.target-args }}

      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-${{ runner.os }}
          path: |
            ${{ matrix.bundle-dir }}/dmg/*.dmg
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/rpm/*.rpm
            ${{ matrix.bundle-dir }}/appimage/*.AppImage
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/nsis/*.exe
          if-no-files-found: error

      - name: Faux client Steam
        run: cargo build --locked --release -p prisma-core --features test-support --example steam_fixture

      - name: Essai de l'app installée (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-test.py ${{ matrix.bundle-dir }}/macos/Prisma.app/Contents/MacOS/prisma target/release/examples/steam_fixture captures

      - name: Essai de l'app installée (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./${{ matrix.bundle-dir }}/deb/*.deb
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- python3 scripts/smoke-test.py /usr/bin/prisma target/release/examples/steam_fixture captures

      - name: Essai de l'app installée (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msi = (Get-ChildItem ${{ matrix.bundle-dir }}/msi/*_en-US.msi).FullName
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn" -Wait
          $app = Get-ChildItem "$env:ProgramFiles\Prisma" -Filter *.exe | Where-Object Name -NotLike 'uninstall*' | Select-Object -First 1
          python scripts/smoke-test.py $app.FullName target/release/examples/steam_fixture.exe captures
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-${{ runner.os }}
          path: captures/

  release:
    name: Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Étiquette conforme à la version de l'app
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "L'étiquette ${GITHUB_REF_NAME} ne correspond pas à la version $version"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          pattern: Prisma-*
          path: installers
          merge-multiple: true

      - name: Publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find installers -mindepth 2 -type f -exec mv {} installers/ \;
          (cd installers && sha256sum $(find . -maxdepth 1 -type f -printf '%f\n' | sort) > SHA256SUMS.txt)
          gh release create "${GITHUB_REF_NAME}" installers/*.* \
            --title "Prisma ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
