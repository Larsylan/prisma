name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Interface
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Formatage
        run: cargo fmt --all --check

      - name: Analyse
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --locked --workspace

      - name: Thèmes du mode démo à jour
        if: runner.os == 'Linux'
        run: |
          cargo run --locked -p prisma-core --example themes > /tmp/demo-themes.json
          diff /tmp/demo-themes.json src/lib/demo-themes.json

      - name: Compilation de l'app
        run: cargo build --locked -p prisma
