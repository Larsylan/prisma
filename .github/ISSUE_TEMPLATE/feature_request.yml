name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The need behind the idea, in a few sentences.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How could Prisma help?
