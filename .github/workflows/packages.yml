name: Installateurs

# Produit les installateurs de chaque système, les installe et lance l'app pour vérifier qu'elle fonctionne vraiment.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: app,dmg
          - os: ubuntu-22.04
            bundles: deb,appimage
          - os: windows-latest
            bundles: msi,nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libdbus-1-dev libxdo-dev xvfb imagemagick dbus

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installateurs
        run: |
          npm ci
          npm run tauri build -- --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: Prisma-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Faux client Steam
        run: cargo build --locked --release -p prisma-core --features test-support --example steam_fixture

      - name: Essai de l'app installée (macOS)
        if: runner.os == 'macOS'
        run: python3 scripts/smoke-test.py target/release/bundle/macos/Prisma.app/Contents/MacOS/prisma target/release/examples/steam_fixture captures

      - name: Essai de l'app installée (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/release/bundle/deb/*.deb
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- python3 scripts/smoke-test.py /usr/bin/prisma target/release/examples/steam_fixture captures

      - name: Essai de l'app installée (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1600 -Height 1000 -Force } catch { Write-Host "Résolution inchangée : $_" }
          $msi = (Get-ChildItem target/release/bundle/msi/*.msi).FullName
          Start-Process msiexec -ArgumentList "/i `"$msi`" /qn" -Wait
          $app = Get-ChildItem "$env:ProgramFiles\Prisma" -Filter *.exe | Where-Object Name -NotLike 'uninstall*' | Select-Object -First 1
          python scripts/smoke-test.py $app.FullName target/release/examples/steam_fixture.exe captures
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-${{ runner.os }}
          path: captures/
